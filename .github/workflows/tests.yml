name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 29 автотестов на галлюцинации
        run: python tests/run_evals.py
      - name: Проверка guardrail на «врущей» модели
        run: python tests/test_guardrail.py
